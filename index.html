<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Agent</title>
<link rel="stylesheet" href="frontend/css/github-dark.min.css" id="hljsTheme">
<link rel="stylesheet" href="frontend/css/hermes-theme-vars.css">
<style>
@font-face{font-family:'Alibaba PuHuiTi 3';src:url('frontend/fonts/AlibabaPuHuiTi3/AlibabaPuHuiTi-3-55-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Alibaba PuHuiTi 3';src:url('frontend/fonts/AlibabaPuHuiTi3/AlibabaPuHuiTi-3-65-Medium.ttf') format('truetype');font-weight:500 600;font-style:normal;font-display:swap}
@font-face{font-family:'Alibaba PuHuiTi 3';src:url('frontend/fonts/AlibabaPuHuiTi3/AlibabaPuHuiTi-3-85-Bold.ttf') format('truetype');font-weight:700 800;font-style:normal;font-display:swap}
@font-face{font-family:'Alibaba PuHuiTi 3';src:url('frontend/fonts/AlibabaPuHuiTi3/AlibabaPuHuiTi-3-95-ExtraBold.ttf') format('truetype');font-weight:900;font-style:normal;font-display:swap}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font-ui:'Alibaba PuHuiTi 3',system-ui,-apple-system,sans-serif;
  --font-mono:'Alibaba PuHuiTi 3','Consolas',monospace;
  --fs-xxs:10px;--fs-xs:11px;--fs-sm:12px;--fs-md:14px;--fs-base:14px;--fs-body:16px;--fs-lg:16px;--fs-xl:18px;--fs-2xl:22px;--fs-3xl:28px;--fs-4xl:32px;
  --lh-tight:1.25;--lh-title:1.35;--lh-ui:1.45;--lh-body:1.65;--lh-doc:1.75;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;--fw-extrabold:900;
  --sidebar-w:60px;
  --chat-rail-w:800px;
  --chat-rail-gutter:clamp(20px,5vw,72px);
  --transition-fast:0.15s ease;--transition-normal:0.25s ease;
  font-feature-settings:'kern' 1;
  --r-xs:2px;--r-sm:var(--r-control-sm);--r-md:var(--r-control-md);--r-lg:var(--r-card);--r-xl:var(--r-panel);--r-pill:var(--r-control-lg);--r-full:var(--r-round);
  --s-hair:1px;--s-xxs:4px;--s-xs:8px;--s-sm:12px;--s-md:16px;
  --s-lg:24px;--s-xl:32px;--s-xxl:48px;--s-section:96px;
}
html,body{height:100%;overflow:hidden;background:var(--c-canvas);color:var(--c-ink);font-family:var(--font-ui);font-size:var(--fs-body);line-height:var(--lh-ui);letter-spacing:-0.15px;-webkit-font-smoothing:antialiased}
a{color:var(--c-accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--c-ink);background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-md);padding:12px 14px;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
input:focus,textarea:focus,select:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
input::placeholder,textarea::placeholder{color:var(--c-ink-muted)}
select{cursor:pointer;appearance:none;-webkit-appearance:none;background-color:var(--c-surface1);background-image:linear-gradient(45deg,transparent 50%,var(--c-ink-muted) 50%),linear-gradient(135deg,var(--c-ink-muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px}
textarea{resize:vertical}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-scrollbar);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--c-scrollbar-hover)}
.app-layout{display:flex;height:100vh;width:100vw;overflow:hidden}
.sidebar{width:var(--sidebar-w);height:100vh;background:var(--c-surface1);border-right:1px solid var(--c-hairline);display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:100}
.sidebar-logo{display:flex;align-items:center;justify-content:center;padding:16px 0;cursor:pointer;flex-shrink:0;min-height:52px;border-bottom:1px solid var(--c-hairline)}
.sidebar-logo .logo-icon{width:32px;height:32px;border-radius:var(--r-md);background:var(--c-primary);display:flex;align-items:center;justify-content:center;font-weight:var(--fw-bold);font-size:var(--fs-lg);color:var(--c-on-primary);flex-shrink:0;transition:all var(--transition-fast)}
.sidebar-logo:hover .logo-icon{transform:scale(1.08)}
.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;min-height:0;display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;justify-content:center;padding:0;width:44px;height:44px;border-radius:var(--r-md);color:var(--c-ink-muted);font-size:var(--fs-base);transition:all var(--transition-fast);cursor:pointer;background:none;border:none;margin:0 auto}
.nav-item:hover{background:var(--c-accent-soft);color:var(--c-ink)}
.nav-item.active{background:var(--c-accent-muted);color:var(--c-accent)}
.nav-item svg{flex-shrink:0}
#globalNavTooltip{position:fixed;z-index:99999;background:var(--c-ink);color:var(--c-canvas);font-size:var(--fs-sm);font-weight:var(--fw-medium);padding:5px 10px;border-radius:var(--r-sm);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.12s ease}
#globalNavTooltip.show{opacity:1}
#globalNavTooltip::before{content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:var(--c-ink)}
.sidebar-footer{padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px;border-top:1px solid var(--c-hairline);flex-shrink:0}
.sidebar-footer .conn-dot{width:10px;height:10px;border-radius:var(--r-full);flex-shrink:0}
.sidebar-footer .conn-dot.online{background:var(--c-success);box-shadow:0 0 6px var(--c-success)}
.sidebar-footer .conn-dot.offline{background:var(--c-error)}
.sidebar-footer .theme-btn{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--c-ink-muted);cursor:pointer;background:transparent;border:none;transition:all var(--transition-fast);line-height:1;padding:0}
.sidebar-footer .theme-btn svg{display:block}
.sidebar-footer .theme-btn:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.sidebar-footer .version-text{font-size:var(--fs-xxs);color:var(--c-ink-muted);font-family:var(--font-mono);letter-spacing:0.5px}

.agent-console-entry{width:44px;height:44px;border-radius:var(--r-md);display:grid;place-items:center;cursor:pointer;color:var(--c-ink-muted);background:transparent;border:none;transition:background var(--transition-fast),color var(--transition-fast);padding:0}
.agent-console-entry:hover{background:var(--c-accent-soft);color:var(--c-ink)}
.agent-console-entry .conn-dot{width:10px;height:10px;border-radius:var(--r-full);flex-shrink:0;background:var(--c-ink-subtle);transition:background var(--transition-fast),box-shadow var(--transition-fast),transform var(--transition-fast)}
.agent-console-entry:hover .conn-dot{transform:scale(1.08)}
.agent-console-entry .conn-dot.online{background:var(--c-success);box-shadow:0 0 6px color-mix(in srgb,var(--c-success) 50%,transparent)}
.agent-console-entry .conn-dot.offline{background:var(--c-ink-subtle);box-shadow:none}
.agent-console-entry .conn-dot.running{background:#f6b73c;box-shadow:0 0 8px rgba(246,183,60,.45)}
.agent-console-entry .conn-dot.error{background:var(--c-error);box-shadow:0 0 8px color-mix(in srgb,var(--c-error) 55%,transparent)}
.agent-console-label{display:none}
.agent-console-panel{position:fixed;left:68px;bottom:82px;width:430px;height:min(600px,calc(100vh - 150px));z-index:9000;display:none;flex-direction:column;background:color-mix(in srgb,var(--c-surface1) 94%,var(--c-canvas));border:1px solid var(--c-hairline);border-radius:24px;box-shadow:0 18px 50px rgba(0,0,0,.18);overflow:hidden;backdrop-filter:blur(16px)}
.agent-console-panel.open{display:flex}
.agent-console-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--c-hairline)}
.agent-console-title{display:flex;align-items:center;gap:8px;font-weight:var(--fw-semibold);font-size:var(--fs-md)}
.agent-console-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.agent-console-action,.agent-console-close{height:28px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);background:var(--c-surface2);color:var(--c-ink-muted);border:1px solid var(--c-hairline);transition:all var(--transition-fast)}
.agent-console-action:hover,.agent-console-close:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.agent-console-action.active{color:var(--c-accent);background:var(--c-accent-soft)}
.agent-console-action.danger{color:var(--c-error)}
.agent-console-close{width:28px;padding:0;border-radius:var(--r-full);font-size:18px;line-height:1}
.agent-console-body{flex:1;min-height:0;overflow:auto;padding:12px 14px 14px;font-family:var(--font-mono);font-size:12px;line-height:1.55;color:var(--c-ink)}
.agent-console-empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--c-ink-muted);font-family:var(--font-sans);font-size:var(--fs-sm)}
.agent-console-line{display:grid;grid-template-columns:46px 54px minmax(0,1fr);gap:8px;padding:4px 0;border-bottom:1px solid color-mix(in srgb,var(--c-hairline) 45%,transparent)}
.agent-console-line:last-child{border-bottom:none}
.agent-console-time{color:var(--c-ink-muted)}
.agent-console-type{font-weight:700;color:var(--c-accent);text-transform:uppercase}
.agent-console-line.error .agent-console-type{color:var(--c-error)}
.agent-console-line.raw_stderr .agent-console-type{color:var(--c-error)}
.agent-console-line.raw_stderr .agent-console-text{color:color-mix(in srgb,var(--c-error) 82%,var(--c-ink))}
.agent-console-line.done .agent-console-type{color:var(--c-success)}
.agent-console-line.user .agent-console-type{color:var(--c-ink)}
.agent-console-line.raw .agent-console-type{color:#f6b73c}
.agent-console-line.exit .agent-console-type{color:var(--c-ink-muted)}
.agent-console-text{white-space:pre-wrap;word-break:break-word;color:var(--c-ink)}
.agent-console-health{display:flex;gap:6px;align-items:center;padding:9px 12px;border-top:1px solid var(--c-hairline);background:color-mix(in srgb,var(--c-surface2) 55%,transparent);overflow-x:auto}
.agent-console-health-item{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--r-pill);font-size:11px;color:var(--c-ink-muted);background:var(--c-surface1);border:1px solid var(--c-hairline);white-space:nowrap}
.agent-console-health-item i{width:7px;height:7px;border-radius:var(--r-full);background:var(--c-ink-subtle)}
.agent-console-health-item.ok i{background:var(--c-success)}
.agent-console-health-item.busy i,.agent-console-health-item.warn i{background:#f6b73c}
.agent-console-health-item.bad i{background:var(--c-error)}
.main-content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--c-canvas);min-width:0}
.page-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--c-hairline);flex-shrink:0;min-height:56px}
.page-header h2{font-size:var(--fs-2xl);font-weight:var(--fw-semibold);letter-spacing:-0.8px}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 20px;border-radius:var(--r-pill);font-size:var(--fs-base);font-weight:var(--fw-medium);letter-spacing:-0.1px;transition:all var(--transition-fast);cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--c-primary);color:var(--c-on-primary)}
.btn-primary:hover{opacity:0.85}
.btn-secondary{background:color-mix(in srgb,var(--c-surface1) 76%,var(--c-canvas));color:var(--c-ink);border:1px solid var(--c-hairline)}
.btn-secondary:hover{background:var(--c-accent-soft);border-color:var(--c-hairline);color:var(--c-ink)}
.btn-accent{background:var(--c-magenta);color:#ffffff;border:none}
.btn-accent:hover{opacity:0.85}
.btn-ghost{background:transparent;color:var(--c-ink-muted);padding:8px 12px}
.btn-ghost:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--c-ink);transition:background var(--transition-fast),color var(--transition-fast)}
.btn-icon svg{width:18px;height:18px}
.btn-icon:hover{background:var(--c-accent-soft)}
.btn-sm{padding:6px 14px;font-size:var(--fs-md)}
.btn-xs{padding:4px 10px;font-size:var(--fs-sm)}
.card{background:var(--c-surface1);border-radius:var(--r-lg);padding:24px;border:1px solid var(--c-hairline);transition:all var(--transition-normal)}
.card:hover{border-color:var(--c-accent-muted)}
.color-block{border-radius:var(--r-lg);padding:48px;position:relative;overflow:hidden}
.color-block-lime{background:var(--c-block-lime);color:var(--c-ink)}
.color-block-lilac{background:var(--c-block-lilac);color:var(--c-ink)}
.color-block-cream{background:var(--c-block-cream);color:var(--c-ink)}
.color-block-pink{background:var(--c-block-pink);color:var(--c-ink)}
.color-block-mint{background:var(--c-block-mint);color:var(--c-ink)}
.color-block-coral{background:var(--c-block-coral);color:var(--c-ink)}
.color-block-navy{background:var(--c-block-navy);color:#ffffff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--c-hairline);padding:0 24px;flex-shrink:0}
.tab{padding:12px 16px;font-size:var(--fs-base);font-weight:var(--fw-medium);color:var(--c-ink-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--transition-fast);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--c-ink)}
.tab.active{color:var(--c-accent);border-bottom-color:var(--c-accent)}
.modal-overlay{position:fixed;inset:0;background:var(--c-overlay);z-index:2200;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--transition-fast)}
.modal-overlay.show{opacity:1;pointer-events:auto}
.history-popup{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--c-overlay);animation:fadeIn 0.2s ease}
.history-popup-inner{width:800px;height:560px;max-width:90vw;max-height:90vh;background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);box-shadow:0 8px 32px rgba(0,0,0,0.18);display:flex;flex-direction:column;overflow:hidden;animation:histPopIn 0.2s ease}
@keyframes histPopIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.history-popup-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--c-hairline);flex-shrink:0}
.history-popup-header h4{font-size:var(--fs-lg);font-weight:var(--fw-semibold)}
.history-popup-actions{display:flex;align-items:center;gap:8px}
.history-popup-filter{display:flex;align-items:center;gap:6px;padding:8px 20px;border-bottom:1px solid var(--c-hairline);flex-shrink:0}
.history-popup-filter .filter-chip{padding:4px 10px;border-radius:var(--r-pill);font-size:var(--fs-sm);cursor:pointer;border:1px solid var(--c-hairline);background:var(--c-canvas);color:var(--c-ink-muted);transition:all var(--transition-fast)}
.history-popup-filter .filter-chip:hover{border-color:var(--c-accent-muted)}
.history-popup-filter .filter-chip.active{background:var(--c-accent-soft);color:var(--c-accent);border-color:var(--c-accent)}
.history-popup-body{flex:1;overflow-y:auto;padding:8px}
.history-popup-close{width:28px;height:28px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;color:var(--c-ink-muted);cursor:pointer;background:transparent;border:none;transition:all var(--transition-fast)}
.history-popup-close:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.hist-popup-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--transition-fast)}
.hist-popup-item:hover{background:var(--c-accent-soft)}
.hist-popup-item.selected{background:var(--c-accent-muted)}
.hist-popup-item input[type=checkbox]{flex-shrink:0;accent-color:var(--c-accent)}
.hist-popup-item-info{flex:1;min-width:0}
.hist-popup-item-title{font-size:var(--fs-md);font-weight:var(--fw-medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-popup-item-preview{font-size:var(--fs-xs);color:var(--c-ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-popup-item-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.source-tag{font-size:var(--fs-xxs);padding:2px 6px;border-radius:var(--r-pill);font-weight:var(--fw-medium)}
.source-tag.webui{background:rgba(59,130,246,0.12);color:#3b82f6}
.source-tag.feishu{background:rgba(139,92,246,0.12);color:#8b5cf6}
.source-tag.terminal{background:rgba(34,197,94,0.12);color:#22c55e}
.source-tag.other{background:var(--c-surface2);color:var(--c-ink-muted)}
.readonly-tag{display:inline-flex;align-items:center;justify-content:center;padding:2px 7px;border-radius:var(--r-pill);background:var(--c-surface2);color:var(--c-ink-muted);border:1px solid var(--c-hairline);font-size:var(--fs-xxs);font-weight:var(--fw-medium);line-height:1.2;vertical-align:middle}
.readonly-tag.mini{font-size:var(--fs-xxs);padding:1px 5px;margin-left:4px}
.hist-row-delete{opacity:0;border:1px solid var(--c-hairline);background:var(--c-surface2);color:var(--c-ink-muted);border-radius:var(--r-pill);padding:3px 8px;font-size:var(--fs-xs);cursor:pointer;transition:opacity var(--transition-fast),background var(--transition-fast),color var(--transition-fast),border-color var(--transition-fast);white-space:nowrap}
.hist-popup-item:hover .hist-row-delete,.hist-item:hover .hist-row-delete{opacity:1}
.hist-row-delete:hover{background:rgba(239,83,80,0.1);border-color:rgba(239,83,80,0.25);color:var(--c-error)}
.modal{background:var(--c-surface1);border-radius:var(--r-lg);border:1px solid var(--c-hairline);width:min(90vw,760px);max-width:calc(100vw - 32px);max-height:80vh;overflow-y:auto;overflow-x:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.06);box-sizing:border-box}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--c-hairline)}
.modal-header h3{font-size:var(--fs-xl);font-weight:var(--fw-semibold);letter-spacing:-0.3px}
.modal-body{padding:24px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--c-hairline)}
.chat-panel{display:flex;height:100%;position:relative}
.session-sidebar{width:260px;border-right:1px solid var(--c-hairline);display:flex;flex-direction:column;flex-shrink:0;background:var(--c-canvas);transition:width var(--transition-normal),opacity var(--transition-normal)}
.session-sidebar.collapsed{width:0;border-right:none;overflow:hidden;opacity:0;pointer-events:none}
.session-sidebar-header{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--c-hairline);flex-shrink:0;position:relative;flex-wrap:wrap}
.session-sidebar-header .new-chat-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:var(--r-md);background:var(--c-accent-soft);color:var(--c-accent);font-size:var(--fs-md);font-weight:var(--fw-medium);cursor:pointer;border:1px dashed var(--c-accent-muted);transition:all var(--transition-fast)}
.session-sidebar-header .new-chat-btn:hover{background:var(--c-accent-muted);border-color:var(--c-accent)}
.agent-switch-btn{width:100%;padding:9px 11px;margin-bottom:12px;border:1px solid var(--c-hairline-soft);border-radius:var(--r-md);background:var(--c-surface1);color:var(--c-ink);font-size:var(--fs-md);font-weight:var(--fw-medium);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:9px;transition:all var(--transition-fast)}
.agent-switch-btn:hover{background:var(--c-accent-soft);border-color:var(--c-accent-muted)}
.agent-switch-copy{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:1px;overflow:hidden}
.agent-switch-copy strong{font-size:var(--fs-md);font-weight:var(--fw-semibold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gc-msg-avatar{width:32px;height:32px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:var(--fs-md);font-weight:var(--fw-semibold);color:#fff;flex-shrink:0}
.gc-msg-body{max-width:70%;min-width:0}
.gc-msg-sender{font-size:var(--fs-sm);font-weight:var(--fw-medium);margin-bottom:2px;color:var(--c-ink-muted)}
.gc-msg.self .gc-msg-sender{text-align:right}
.gc-msg-bubble{padding:10px 14px;border-radius:var(--r-lg);font-size:var(--fs-base);line-height:1.5;word-break:break-word;background:var(--md-card-bg,var(--c-surface2));color:var(--md-ink,var(--c-ink))}
.gc-msg.self .gc-msg-bubble{background:var(--c-accent);color:var(--c-on-primary)}
.gc-msg.agent .gc-msg-bubble{background:var(--md-card-bg,var(--c-block-lilac));color:var(--md-ink,var(--c-ink))}
.gc-msg-time{font-size:var(--fs-xs);color:var(--c-ink-muted);margin-top:4px}
.gc-msg.self .gc-msg-time{text-align:right}
.gc-msg .mention{color:var(--c-magenta);font-weight:var(--fw-medium)}
.gc-md-actions{margin-top:10px;padding-top:8px;border-top:1px solid var(--md-border,color-mix(in srgb,var(--c-ink) 12%,transparent))}
.gc-status-bar{padding:6px 20px;font-size:var(--fs-sm);color:var(--c-ink-muted);border-top:1px solid var(--md-border,var(--c-hairline-soft));flex-shrink:0;min-height:24px;display:flex;align-items:center;gap:6px}
.gc-typing-dots{display:inline-flex;gap:3px}
.gc-typing-dots span{width:4px;height:4px;border-radius:var(--r-full);background:var(--c-ink-muted);animation:typingBounce 1.2s infinite}
.gc-typing-dots span:nth-child(2){animation-delay:0.2s}
.gc-typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.gc-input-area{padding:12px 20px;border-top:1px solid var(--c-hairline);flex-shrink:0;position:relative}
.gc-input-wrap{display:flex;gap:8px;align-items:flex-end}
.gc-input-wrap textarea{flex:1;padding:10px 14px;border-radius:var(--r-lg);border:1px solid var(--c-hairline);background:var(--c-canvas);color:var(--c-ink);font-size:var(--fs-base);line-height:1.5;resize:none;min-height:42px;max-height:120px;transition:border-color var(--transition-fast)}
.gc-input-wrap textarea:focus{border-color:var(--c-accent);outline:none}
.gc-mention-menu{position:absolute;bottom:100%;left:20px;right:20px;background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-md);box-shadow:0 4px 16px rgba(0,0,0,0.12);max-height:200px;overflow-y:auto;z-index:50;display:none}
.gc-mention-menu.show{display:block}
.gc-mention-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;font-size:var(--fs-md);transition:background var(--transition-fast)}
.gc-mention-item:hover,.gc-mention-item.active{background:var(--c-accent-soft)}
.gc-mention-item .gc-mention-avatar{width:24px;height:24px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:var(--fs-xxs);font-weight:var(--fw-semibold);color:#fff}
.gc-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--c-ink-muted)}
.gc-empty svg{opacity:0.3}
.gc-agent-card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--c-hairline);margin-bottom:6px;transition:all var(--transition-fast)}
.gc-agent-card:hover{border-color:var(--c-accent-muted)}
.gc-agent-card .gc-agent-avatar{width:32px;height:32px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;font-size:var(--fs-md);font-weight:var(--fw-semibold);color:#fff;flex-shrink:0}
.gc-agent-info{flex:1;min-width:0}
.gc-agent-name{font-size:var(--fs-base);font-weight:var(--fw-medium)}
.gc-agent-desc{font-size:var(--fs-sm);color:var(--c-ink-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-agent-remove{width:28px;height:28px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;color:var(--c-ink-muted);cursor:pointer;transition:all var(--transition-fast);background:transparent;border:none;flex-shrink:0}
.gc-agent-remove:hover{color:var(--c-error);background:rgba(229,57,53,0.1)}
@media(max-width:768px){
  .gc-rooms{position:absolute;left:0;top:0;bottom:0;z-index:30;width:260px;transform:translateX(-100%);transition:transform var(--transition-normal)}
  .gc-rooms.open{transform:translateX(0)}
  .gc-rooms-backdrop{position:absolute;inset:0;background:var(--c-overlay);z-index:29;display:none}
  .gc-rooms-backdrop.show{display:block}
}
/* ===== Terminal View ===== */
.terminal-view{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}
.terminal-container{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:16px;min-height:0;max-height:0;transition:max-height 0.3s ease;background:var(--c-terminal-bg);font-family:var(--font-mono);font-size:var(--fs-md);line-height:1.6;color:var(--c-terminal-ink)}
.terminal-container.expanded{max-height:100vh;overflow-y:auto}
.terminal-output{flex:1;overflow-y:auto;padding:16px 20px;background:var(--c-terminal-bg,#0d0d0d);color:var(--c-terminal-ink,#e0e0e0);font-family:var(--font-mono);font-size:var(--fs-md);line-height:1.6;white-space:pre-wrap;word-break:break-word}
.term-line{padding:2px 0;display:flex;gap:8px;word-break:break-word;white-space:pre-wrap}
.term-line .term-prompt{color:var(--c-success,#22c55e);flex-shrink:0;user-select:none}
.term-sep{height:12px}
.term-badge{font-size:var(--fs-sm);padding:2px 10px;border-radius:var(--r-pill);background:var(--c-surface2);color:var(--c-ink-muted);font-family:var(--font-mono)}
.term-session{padding:10px 12px;margin:4px 0;border:1px solid var(--c-hairline);border-radius:var(--r-md);cursor:pointer;transition:all var(--transition-fast);background:var(--c-surface1)}
.term-session:hover{border-color:var(--c-accent-muted);background:var(--c-accent-soft)}
.term-session-title{font-size:var(--fs-base);font-weight:var(--fw-semibold);color:var(--c-ink);display:flex;align-items:center;gap:6px}
.term-session-title .term-prompt{color:var(--c-success);font-size:var(--fs-sm)}
.term-session-meta{font-size:var(--fs-xs);color:var(--c-ink-muted);margin:2px 0;font-family:var(--font-mono)}
.term-session-preview{font-size:var(--fs-sm);color:var(--c-ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ===== History View ===== */
.history-panel{display:flex;flex-direction:column;height:100%;overflow:hidden}
.hist-list{flex:1;overflow-y:auto;padding:12px 20px}
.hist-date-header{font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--c-ink-muted);text-transform:uppercase;letter-spacing:0.5px;padding:12px 4px 6px;display:flex;align-items:center;gap:6px}
.hist-count{font-size:var(--fs-xxs);padding:1px 6px;border-radius:var(--r-pill);background:var(--c-hairline);color:var(--c-ink-muted)}
.hist-total{font-size:var(--fs-sm);font-weight:var(--fw-regular);color:var(--c-ink-muted);margin-left:4px}
.hist-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-md);transition:all var(--transition-fast);position:relative;margin:2px 0}
.hist-item:hover{background:var(--c-accent-soft)}
.hist-item.selected{background:var(--c-accent-muted)}
.hist-check{flex-shrink:0;margin-top:3px;cursor:pointer;display:flex;align-items:center}
.hist-cb{width:16px;height:16px;accent-color:var(--c-accent);cursor:pointer}
.hist-body{flex:1;cursor:pointer;min-width:0}
.hist-title{font-size:var(--fs-base);font-weight:var(--fw-medium);color:var(--c-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-meta{display:flex;align-items:center;gap:8px;font-size:var(--fs-xs);color:var(--c-ink-muted);margin:2px 0;flex-wrap:wrap}
.hist-preview{font-size:var(--fs-sm);color:var(--c-ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-more-wrap{position:relative;flex-shrink:0;opacity:0;transition:opacity var(--transition-fast)}
.hist-item:hover .hist-more-wrap{opacity:1}
.hist-more-btn{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--c-ink-muted);font-size:var(--fs-lg);cursor:pointer;background:transparent;border:none;transition:all var(--transition-fast)}
.hist-more-btn:hover{background:var(--c-surface2);color:var(--c-ink)}
.hist-menu{position:absolute;right:0;top:100%;min-width:140px;background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-md);box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:100;display:none;overflow:hidden}
.hist-menu.show{display:block}
.hist-menu button{display:block;width:100%;padding:8px 14px;font-size:var(--fs-md);text-align:left;color:var(--c-ink);background:none;border:none;cursor:pointer;transition:background var(--transition-fast)}
.hist-menu button:hover{background:var(--c-accent-soft)}
.hist-menu button.danger{color:var(--c-error)}
.hist-menu button.danger:hover{background:rgba(239,83,80,0.1)}
/* ===== Group Chat Room Menu ===== */
.gc-room-info{flex:1;min-width:0}
.gc-room-more-wrap{flex-shrink:0;opacity:0;transition:opacity var(--transition-fast);position:relative}
.gc-room-item:hover .gc-room-more-wrap{opacity:1}
.gc-room-more-btn{width:24px;height:24px;border-radius:4px;display:grid;place-items:center;color:var(--c-ink-muted);font-size:var(--fs-base);cursor:pointer;background:transparent;border:none;transition:all var(--transition-fast);margin-top:2px}
.gc-room-more-btn:hover{background:var(--c-surface2);color:var(--c-ink)}
.gc-room-menu{position:fixed;min-width:130px;background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-md);box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:9999;display:none;overflow:hidden}
.gc-room-menu.show{display:block}
.gc-room-menu button{display:block;width:100%;padding:7px 12px;font-size:var(--fs-sm);text-align:left;color:var(--c-ink);background:none;border:none;cursor:pointer;transition:background var(--transition-fast)}
.gc-room-menu button:hover{background:var(--c-accent-soft)}
.gc-room-menu button.danger{color:var(--c-error)}
.gc-room-menu button.danger:hover{background:rgba(239,83,80,0.1)}
/* ===== Session (chat sidebar) More Menu ===== */
.session-item{height:58px;display:flex;align-items:center;gap:0;position:relative;border-radius:var(--r-md);transition:background var(--transition-fast),box-shadow var(--transition-fast);padding:0;margin:3px 4px;overflow:visible}
.session-item:hover{background:var(--c-accent-soft)}
.session-item.active{background:var(--c-accent-muted);box-shadow:none}
.session-item-body{height:100%;flex:1;cursor:pointer;padding:9px 10px 9px 12px;display:flex;align-items:center;min-width:0;overflow:hidden}
.session-card-main{min-width:0;width:100%;display:flex;flex-direction:column;gap:4px}
.session-card-top{display:flex;align-items:center;gap:6px;min-width:0}
.session-item-body .s-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;line-height:18px}
.session-item-body .s-preview{display:block;line-height:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-more-wrap{flex-shrink:0;opacity:0.78;transition:opacity var(--transition-fast),transform var(--transition-fast);padding:4px;position:relative}
.session-item:hover .session-more-wrap,.session-item:focus-within .session-more-wrap,.session-item.active .session-more-wrap{opacity:1;transform:none}
.session-more-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--c-ink-muted);cursor:pointer;background:transparent;border:none;transition:all var(--transition-fast)}
.session-more-btn:hover,.session-more-btn:focus-visible{color:var(--c-ink);background:transparent;outline:none}
.session-menu{position:absolute;right:0;top:100%;min-width:140px;background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-md);box-shadow:0 4px 16px rgba(0,0,0,0.12);z-index:100;display:none;overflow:hidden;padding:6px}
.session-menu.show{display:block}
.session-menu button{display:flex;align-items:center;gap:8px;width:100%;padding:8px 14px;font-size:var(--fs-sm);text-align:left;color:var(--c-ink);background:none;border:none;cursor:pointer;transition:background var(--transition-fast);white-space:nowrap}
.session-menu button:hover{background:var(--c-accent-soft)}
.session-menu button.danger{color:var(--c-error)}
.session-menu button.danger:hover{background:rgba(239,83,80,0.1)}
/* ===== Message model badge ===== */
.msg-model-badge{font-size:var(--fs-xxs);color:var(--c-ink-muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--md-border,var(--c-hairline-soft));font-family:var(--font-mono);opacity:0.6}
/* ===== Rename Modal ===== */
.rename-modal{padding:24px;min-width:320px}
.rename-modal h3{font-size:var(--fs-lg);font-weight:var(--fw-semibold);margin-bottom:16px}
.rename-modal .input{width:100%;margin-bottom:16px}
.rename-actions{display:flex;justify-content:flex-end;gap:8px}
.modal.doc-rename-shell{width:min(420px,calc(100vw - 40px));border:1px solid var(--c-hairline-soft);border-radius:20px;background:var(--c-surface1);box-shadow:0 18px 46px rgba(15,23,42,.16);overflow:hidden}
.doc-rename-modal{padding:20px;box-sizing:border-box}
.doc-rename-head{display:flex;gap:12px;margin-bottom:18px}
.doc-rename-icon{width:38px;height:38px;border-radius:13px;background:var(--c-accent-soft);color:var(--c-ink);display:grid;place-items:center;flex:0 0 auto}
.doc-rename-title{min-width:0}
.doc-rename-head h3{font-size:var(--fs-lg);font-weight:var(--fw-semibold);letter-spacing:-0.01em;margin:0 0 5px;color:var(--c-ink);line-height:1.3}
.doc-rename-head p{font-size:var(--fs-sm);line-height:1.5;color:var(--c-ink-muted);margin:0}
.doc-rename-field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.doc-rename-field span{font-size:var(--fs-sm);font-weight:var(--fw-medium);color:var(--c-ink-muted)}
.doc-rename-field .rename-input{width:100%;height:42px;border:1px solid var(--c-hairline);border-radius:12px;background:var(--c-input-bg);color:var(--c-ink);font:inherit;font-size:var(--fs-base);padding:0 13px;box-sizing:border-box;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast),background var(--transition-fast)}
.doc-rename-field .rename-input:hover{border-color:color-mix(in srgb,var(--c-ink-muted) 32%,var(--c-hairline))}
.doc-rename-field .rename-input:focus{border-color:color-mix(in srgb,var(--c-ink-muted) 46%,var(--c-hairline));box-shadow:0 0 0 3px var(--c-accent-soft);background:var(--c-surface1)}
.doc-rename-modal .rename-actions{justify-content:flex-end;gap:10px;padding-top:2px}
.doc-rename-modal .btn{height:36px;border-radius:999px;padding:0 16px;font-size:var(--fs-md);font-weight:var(--fw-medium);border:1px solid transparent}
.doc-rename-modal .btn-ghost{background:var(--c-input-bg);border-color:var(--c-hairline);color:var(--c-ink-muted)}
.doc-rename-modal .btn-ghost:hover{background:var(--c-accent-soft);color:var(--c-ink)}
.doc-rename-modal .btn-primary{background:var(--c-ink);color:var(--c-canvas)}
.doc-rename-modal .btn-primary:hover{opacity:.88}

/* Settings inner navigation and model layout refinements */
.settings-inner-shell{grid-template-columns:240px minmax(0,1fr)}
.settings-inner-nav{background:color-mix(in srgb,var(--c-surface1) 78%,var(--c-canvas));padding:18px 12px}
.settings-inner-shell .settings-main-panel{overflow:hidden}
.settings-inner-shell .settings-view{height:100%}
.settings-side-category{font-size:var(--fs-xs);font-weight:var(--fw-bold);color:var(--c-ink-muted);letter-spacing:.06em;padding:8px 10px 4px;text-transform:uppercase}
.settings-side-item.level-1{padding-left:13px}
.settings-side-sub{margin-left:18px}
.settings-side-subitem.level-2{position:relative;padding-left:14px}
.settings-side-subitem.level-2::before{content:'';position:absolute;left:4px;top:50%;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.35;transform:translateY(-50%)}
.system-prompt-textarea{background:var(--c-input-bg)!important;color:var(--c-ink)!important;border-color:var(--c-hairline)!important}
.model-scenario-panel{margin-bottom:24px}
.model-scenario-panel .model-panel-head{margin-bottom:18px}
.scenario-card-grid{gap:16px}
.model-main-layout{align-items:stretch;min-height:calc(100vh - 360px);gap:22px}
.model-main-layout>.model-panel{height:100%;display:flex;flex-direction:column}
.model-fetch-panel .model-connector-grid{margin-top:12px}
.model-field-label{font-size:var(--fs-sm);font-weight:var(--fw-bold);color:var(--c-ink);margin:4px 0 6px}
.model-field{display:flex;flex-direction:column;gap:6px}
.model-field input,.model-field select{width:100%;padding:9px 11px}
.model-fetch-panel #fetchModelsList,.model-library-panel .model-lib-list{flex:1;min-height:0}
.model-library-panel .model-lib-list{max-height:none;overflow:auto}
@media(max-width:900px){
  .settings-inner-shell{grid-template-columns:1fr}
  .settings-inner-nav{display:flex;gap:8px;overflow-x:auto;border-right:none;border-bottom:1px solid var(--c-hairline);padding:10px 12px;min-height:auto}
  .settings-inner-nav .settings-side-title,.settings-inner-nav .settings-side-category{display:none}
  .settings-inner-nav .settings-side-group{min-width:150px;margin-bottom:0}
  .settings-inner-nav .settings-side-sub{display:none}
  .settings-grid-2,.scenario-card-grid,.model-main-layout{grid-template-columns:1fr}
  .model-main-layout{min-height:0}
  .model-panel-head{flex-direction:column}
  .model-fastest-hint{justify-content:flex-start;max-width:none}
}

.settings-inner-nav{padding:14px 10px}
.settings-side-list{display:flex;flex-direction:column;gap:4px}
.settings-side-link{width:100%;border:none;background:transparent;color:var(--c-ink-muted);font-family:inherit;text-align:left;cursor:pointer;border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-md);font-weight:var(--fw-semibold);transition:background var(--transition-fast),color var(--transition-fast)}
.settings-side-link:hover{background:var(--c-accent-soft);color:var(--c-ink)}
.settings-side-link.active{background:var(--c-accent-soft);color:var(--c-accent);box-shadow:none}
.settings-side-item.active{box-shadow:none}
.settings-side-item.level-1,.settings-side-subitem.level-2{padding-left:12px}

@media(max-width:900px){
  .settings-side-list{flex-direction:row;gap:8px}
  .settings-side-link{white-space:nowrap;flex:0 0 auto}
}
.chat-input-toolbar{align-items:flex-end}
.chat-input-left{align-items:flex-end;gap:6px}
.chat-input-left .input-action-btn.toolbar-icon-btn{width:36px!important;height:36px!important;min-width:36px!important;padding:0!important;border-radius:var(--r-md);display:inline-flex;align-items:center;justify-content:center;gap:0;font-size:0!important;line-height:1}

.chat-input-box{min-height:112px;max-height:320px;padding:12px 12px 10px!important;gap:8px}
.chat-input-box textarea{padding:4px 4px 0 0!important;min-height:36px;line-height:1.45;box-sizing:border-box}

.chat-input-left .input-action-btn.toolbar-icon-btn{width:32px!important;height:32px!important;min-width:32px!important;border-radius:var(--r-sm)}
.chat-input-left .input-action-btn.toolbar-icon-btn svg{width:16px;height:16px}
#modelPopupBtn{border-radius:var(--r-md);transition:background var(--transition-fast),color var(--transition-fast),box-shadow var(--transition-fast)}
#modelPopupBtn:hover{background:var(--c-accent-soft)!important;color:var(--c-ink)!important;box-shadow:0 0 0 1px var(--c-hairline-soft) inset}
.chat-input-left .image-gen-toggle.toolbar-icon-btn{width:32px!important;height:32px!important;min-width:32px!important;padding:0!important}
.chat-input-toolbar{margin-top:auto;min-height:32px;height:32px}
.chat-input-left,.chat-input-right{height:32px;align-items:center}

.chat-input-toolbar{margin-bottom:-1px}

.chat-input-box textarea{padding-left:8px!important;padding-right:8px!important}
.chat-input-toolbar{margin-bottom:0!important;height:32px;min-height:32px}
