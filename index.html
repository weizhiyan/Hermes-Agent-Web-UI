<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hermes Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github-dark.min.css" id="hljsTheme" media="print" onload="this.media='all'">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font-ui:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code','Consolas',monospace;
  --sidebar-w:60px;
  --transition-fast:0.15s ease;--transition-normal:0.25s ease;
  font-feature-settings:'kern' 1;
  --r-xs:2px;--r-sm:6px;--r-md:8px;--r-lg:24px;--r-xl:32px;--r-pill:50px;--r-full:9999px;
  --s-hair:1px;--s-xxs:4px;--s-xs:8px;--s-sm:12px;--s-md:16px;
  --s-lg:24px;--s-xl:32px;--s-xxl:48px;--s-section:96px;
}
[data-theme="light"]{
  --c-primary:#000000;--c-on-primary:#ffffff;
  --c-ink:#000000;--c-ink-muted:#666666;
  --c-canvas:#ffffff;
  --c-surface1:#f7f7f5;--c-surface2:#f1f1f1;
  --c-hairline:#e6e6e6;--c-hairline-soft:#f1f1f1;
  --c-accent:#000000;
  --c-accent-soft:rgba(0,0,0,0.06);--c-accent-muted:rgba(0,0,0,0.12);
  --c-success:#1ea64a;--c-error:#e53935;--c-warning:#f9a825;
  --c-block-lime:#dceeb1;--c-block-lilac:#c5b0f4;--c-block-cream:#f4ecd6;
  --c-block-pink:#efd4d4;--c-block-mint:#c8e6cd;--c-block-coral:#f3c9b6;
  --c-block-navy:#1f1d3d;--c-magenta:#ff3d8b;
  --c-overlay:rgba(0,0,0,0.6);
  --c-scrollbar:#d0d0d0;--c-scrollbar-hover:#b0b0b0;
  --c-code-bg:#f1f1f1;
  --c-terminal-bg:#1a1a1a;--c-terminal-ink:#e0e0e0;
  --c-input-bg:#ffffff;
  --c-input-shadow:0 8px 32px rgba(0,0,0,0.10),0 2px 8px rgba(0,0,0,0.06);
}
[data-theme="dark"]{
  --c-primary:#ffffff;--c-on-primary:#000000;
  --c-ink:#ffffff;--c-ink-muted:#888888;
  --c-canvas:#0a0a0a;
  --c-surface1:#141414;--c-surface2:#1c1c1c;
  --c-hairline:#262626;--c-hairline-soft:#1a1a1a;
  --c-accent:#ffffff;
  --c-accent-soft:rgba(255,255,255,0.06);--c-accent-muted:rgba(255,255,255,0.12);
  --c-success:#22c55e;--c-error:#ef5350;--c-warning:#ffb74d;
  --c-block-lime:#2a3a1a;--c-block-lilac:#2a1f4a;--c-block-cream:#3a3420;
  --c-block-pink:#3a2020;--c-block-mint:#1a3a22;--c-block-coral:#3a2a1a;
  --c-block-navy:#1f1d3d;--c-magenta:#ff3d8b;
  --c-overlay:rgba(0,0,0,0.7);
  --c-scrollbar:#333333;--c-scrollbar-hover:#444444;
  --c-code-bg:#1c1c1c;
  --c-terminal-bg:#0d0d0d;--c-terminal-ink:#e0e0e0;
  --c-input-bg:var(--c-surface1);
  --c-input-shadow:0 8px 32px rgba(0,0,0,0.45),0 2px 8px rgba(0,0,0,0.25);
}
html,body{height:100%;overflow:hidden;background:var(--c-canvas);color:var(--c-ink);font-family:var(--font-ui);font-size:15px;line-height:1.45;letter-spacing:-0.15px;-webkit-font-smoothing:antialiased}
a{color:var(--c-accent);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--c-ink);background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-md);padding:12px 14px;outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
input:focus,textarea:focus,select:focus{border-color:var(--c-accent);box-shadow:0 0 0 3px var(--c-accent-soft)}
input::placeholder,textarea::placeholder{color:var(--c-ink-muted)}
select{cursor:pointer;appearance:auto}
textarea{resize:vertical}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--c-scrollbar);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--c-scrollbar-hover)}
.app-layout{display:flex;height:100vh;width:100vw;overflow:hidden}
.sidebar{width:var(--sidebar-w);height:100vh;background:var(--c-surface1);border-right:1px solid var(--c-hairline);display:flex;flex-direction:column;flex-shrink:0;position:relative;z-index:100}
.sidebar-logo{display:flex;align-items:center;justify-content:center;padding:16px 0;cursor:pointer;flex-shrink:0;min-height:52px;border-bottom:1px solid var(--c-hairline)}
.sidebar-logo .logo-icon{width:32px;height:32px;border-radius:var(--r-md);background:var(--c-primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:var(--c-on-primary);flex-shrink:0;transition:all var(--transition-fast)}
.sidebar-logo:hover .logo-icon{transform:scale(1.08)}
.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px;min-height:0;display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;justify-content:center;padding:0;width:44px;height:44px;border-radius:var(--r-md);color:var(--c-ink-muted);font-size:14px;transition:all var(--transition-fast);cursor:pointer;background:none;border:none;margin:0 auto}
.nav-item:hover{background:var(--c-accent-soft);color:var(--c-ink)}
.nav-item.active{background:var(--c-accent-muted);color:var(--c-accent)}
.nav-item svg{flex-shrink:0}
#globalNavTooltip{position:fixed;z-index:99999;background:var(--c-ink);color:var(--c-canvas);font-size:12px;font-weight:480;padding:5px 10px;border-radius:var(--r-sm);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 0.12s ease}
#globalNavTooltip.show{opacity:1}
#globalNavTooltip::before{content:'';position:absolute;right:100%;top:50%;transform:translateY(-50%);border:5px solid transparent;border-right-color:var(--c-ink)}
.sidebar-footer{padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px;border-top:1px solid var(--c-hairline);flex-shrink:0}
.sidebar-footer .conn-dot{width:10px;height:10px;border-radius:var(--r-full);flex-shrink:0}
.sidebar-footer .conn-dot.online{background:var(--c-success);box-shadow:0 0 6px var(--c-success)}
.sidebar-footer .conn-dot.offline{background:var(--c-error)}
.sidebar-footer .theme-btn{width:44px;height:44px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--c-ink-muted);cursor:pointer;background:transparent;border:none;transition:all var(--transition-fast)}
.sidebar-footer .theme-btn:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.sidebar-footer .version-text{font-size:9px;color:var(--c-ink-muted);font-family:var(--font-mono);letter-spacing:0.5px}
.main-content{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--c-canvas);min-width:0}
.page-header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--c-hairline);flex-shrink:0;min-height:56px}
.page-header h2{font-size:22px;font-weight:600;letter-spacing:-0.8px}
.header-actions{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 20px;border-radius:var(--r-pill);font-size:14px;font-weight:480;letter-spacing:-0.1px;transition:all var(--transition-fast);cursor:pointer;white-space:nowrap}
.btn-primary{background:var(--c-primary);color:var(--c-on-primary)}
.btn-primary:hover{opacity:0.85}
.btn-secondary{background:var(--c-canvas);color:var(--c-ink);border:1px solid var(--c-hairline)}
.btn-secondary:hover{background:var(--c-surface1)}
.btn-accent{background:var(--c-magenta);color:#ffffff;border:none}
.btn-accent:hover{opacity:0.85}
.btn-ghost{background:transparent;color:var(--c-ink-muted);padding:8px 12px}
.btn-ghost:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.btn-icon{width:36px;height:36px;padding:0;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;background:var(--c-surface1);color:var(--c-ink);transition:all var(--transition-fast)}
.btn-icon:hover{background:var(--c-surface2)}
.btn-sm{padding:6px 14px;font-size:13px}
.btn-xs{padding:4px 10px;font-size:12px}
.card{background:var(--c-surface1);border-radius:var(--r-lg);padding:24px;border:1px solid var(--c-hairline);transition:all var(--transition-normal)}
.card:hover{border-color:var(--c-accent-muted)}
.color-block{border-radius:var(--r-lg);padding:48px;position:relative;overflow:hidden}
.color-block-lime{background:var(--c-block-lime);color:var(--c-ink)}
.color-block-lilac{background:var(--c-block-lilac);color:var(--c-ink)}
.color-block-cream{background:var(--c-block-cream);color:var(--c-ink)}
.color-block-pink{background:var(--c-block-pink);color:var(--c-ink)}
.color-block-mint{background:var(--c-block-mint);color:var(--c-ink)}
.color-block-coral{background:var(--c-block-coral);color:var(--c-ink)}
.color-block-navy{background:var(--c-block-navy);color:#ffffff}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--c-hairline);padding:0 24px;flex-shrink:0}
.tab{padding:12px 16px;font-size:14px;font-weight:480;color:var(--c-ink-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all var(--transition-fast);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--c-ink)}
.tab.active{color:var(--c-accent);border-bottom-color:var(--c-accent)}
.modal-overlay{position:fixed;inset:0;background:var(--c-overlay);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity var(--transition-fast)}
.modal-overlay.show{opacity:1;pointer-events:auto}
.history-popup{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--c-overlay);animation:fadeIn 0.2s ease}
.history-popup-inner{width:800px;height:560px;max-width:90vw;max-height:90vh;background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);box-shadow:0 8px 32px rgba(0,0,0,0.18);display:flex;flex-direction:column;overflow:hidden;animation:histPopIn 0.2s ease}
@keyframes histPopIn{from{opacity:0;transform:scale(0.96)}to{opacity:1;transform:scale(1)}}
.history-popup-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--c-hairline);flex-shrink:0}
.history-popup-header h4{font-size:16px;font-weight:600}
.history-popup-actions{display:flex;align-items:center;gap:8px}
.history-popup-filter{display:flex;align-items:center;gap:6px;padding:8px 20px;border-bottom:1px solid var(--c-hairline);flex-shrink:0}
.history-popup-filter .filter-chip{padding:4px 10px;border-radius:var(--r-pill);font-size:12px;cursor:pointer;border:1px solid var(--c-hairline);background:var(--c-canvas);color:var(--c-ink-muted);transition:all var(--transition-fast)}
.history-popup-filter .filter-chip:hover{border-color:var(--c-accent-muted)}
.history-popup-filter .filter-chip.active{background:var(--c-accent-soft);color:var(--c-accent);border-color:var(--c-accent)}
.history-popup-body{flex:1;overflow-y:auto;padding:8px}
.history-popup-close{width:28px;height:28px;border-radius:var(--r-full);display:flex;align-items:center;justify-content:center;color:var(--c-ink-muted);cursor:pointer;background:transparent;border:none;transition:all var(--transition-fast)}
.history-popup-close:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.hist-popup-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;transition:background var(--transition-fast)}
.hist-popup-item:hover{background:var(--c-accent-soft)}
.hist-popup-item.selected{background:var(--c-accent-muted)}
.hist-popup-item input[type=checkbox]{flex-shrink:0;accent-color:var(--c-accent)}
.hist-popup-item-info{flex:1;min-width:0}
.hist-popup-item-title{font-size:13px;font-weight:480;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-popup-item-preview{font-size:11px;color:var(--c-ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-popup-item-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.source-tag{font-size:10px;padding:2px 6px;border-radius:var(--r-pill);font-weight:480}
.source-tag.webui{background:rgba(59,130,246,0.12);color:#3b82f6}
.source-tag.feishu{background:rgba(139,92,246,0.12);color:#8b5cf6}
.source-tag.terminal{background:rgba(34,197,94,0.12);color:#22c55e}
.source-tag.other{background:var(--c-surface2);color:var(--c-ink-muted)}
.modal{background:var(--c-surface1);border-radius:var(--r-lg);border:1px solid var(--c-hairline);width:90%;max-width:520px;max-height:80vh;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--c-hairline)}
.modal-header h3{font-size:18px;font-weight:600;letter-spacing:-0.3px}
.modal-body{padding:24px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:16px 24px;border-top:1px solid var(--c-hairline)}
.chat-panel{display:flex;height:100%;position:relative}
.session-sidebar{width:260px;border-right:1px solid var(--c-hairline);display:flex;flex-direction:column;flex-shrink:0;background:var(--c-canvas);transition:width var(--transition-normal),opacity var(--transition-normal)}
.session-sidebar.collapsed{width:0;border-right:none;overflow:hidden;opacity:0;pointer-events:none}
.session-sidebar-header{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--c-hairline);flex-shrink:0}
.session-sidebar-header .new-chat-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:var(--r-md);background:var(--c-accent-soft);color:var(--c-accent);font-size:13px;font-weight:480;cursor:pointer;border:1px dashed var(--c-accent-muted);transition:all var(--transition-fast)}
.session-sidebar-header .new-chat-btn:hover{background:var(--c-accent-muted);border-color:var(--c-accent)}
.session-sidebar-header .history-btn{width:36px;height:36px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:var(--c-ink-muted);cursor:pointer;background:transparent;border:none;transition:all var(--transition-fast);flex-shrink:0}
.session-sidebar-header .history-btn:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.session-items{flex:1;overflow-y:auto;padding:4px}
.session-item .s-title{font-size:13px;font-weight:480;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .s-preview{font-size:11px;color:var(--c-ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .s-time{font-size:10px;color:var(--c-ink-muted)}
.session-group-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px}
.session-group-label{font-size:11px;font-weight:600;color:var(--c-ink-muted);text-transform:uppercase;letter-spacing:0.5px}
.session-group-count{font-size:10px;color:var(--c-ink-muted);background:var(--c-hairline);padding:1px 6px;border-radius:var(--r-pill)}
.model-item{padding:8px 0;border-bottom:1px solid var(--c-hairline-soft)}
.model-item:last-child{border-bottom:none}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-workbench{display:flex;flex:1;flex-direction:row;min-width:0;min-height:0;position:relative;overflow:hidden}
.chat-workbench::after{content:'';position:absolute;top:0;bottom:0;right:0;width:0;pointer-events:none;background:linear-gradient(270deg, color-mix(in srgb, var(--c-accent-muted) 22%, transparent), transparent);opacity:0;transition:width 0.28s ease-out,opacity 0.22s ease-out}
.chat-workbench[data-layout="SPLIT_VIEW"]::after{width:28px;opacity:0.55}
.chat-workbench[data-layout="PREVIEW_ONLY"]::after{width:0;opacity:0}
.chat-main-pane{transition:flex 0.28s ease-out,width 0.28s ease-out,opacity 0.22s ease-out,transform 0.28s ease-out,filter 0.28s ease-out}
.chat-workbench[data-layout="SPLIT_VIEW"] .chat-main-pane{opacity:0.98;transform:translateX(-4px);filter:saturate(0.98)}
.chat-workbench[data-layout="PREVIEW_ONLY"] .chat-main-pane{opacity:0;transform:translateX(-18px);filter:blur(1px)}
.artifact-resizer{flex:0 0 10px;cursor:col-resize;background:transparent;position:relative;z-index:5;display:none;touch-action:none;transition:background var(--transition-fast),opacity var(--transition-fast)}
.artifact-resizer::before{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:3px;height:72px;border-radius:999px;background:color-mix(in srgb, var(--c-hairline) 72%, transparent);transition:background var(--transition-fast),height var(--transition-fast),box-shadow var(--transition-fast)}
.artifact-resizer:hover{background:color-mix(in srgb, var(--c-accent-soft) 64%, transparent)}
.artifact-resizer:hover::before{height:104px;background:var(--c-accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--c-accent-muted) 52%, transparent)}
.artifact-shell{flex:0 0 0;min-width:0;width:0;overflow:hidden;background:color-mix(in srgb, var(--c-surface1) 92%, var(--c-canvas));border-left:1px solid var(--c-hairline);display:flex;flex-direction:column;min-height:0;transition:transform 0.28s ease-out,flex 0.22s ease-in,opacity 0.2s,border-color 0.22s ease-out;transform:translateX(100%);opacity:0;box-shadow:none;position:relative}
.artifact-shell.open{flex:1 1 auto;min-width:320px;width:38%;max-width:55vw;transform:translateX(0);opacity:1;box-shadow:none}
.artifact-shell.open.full{flex:1 1 100%;min-width:100%;max-width:100%;width:100%;border-left:none;box-shadow:none}
.artifact-edge-resizer{position:absolute;top:0;right:0;bottom:0;width:14px;border:none;padding:0;cursor:col-resize;background:transparent;display:none;touch-action:none;z-index:6}
.artifact-edge-resizer::before{content:'';position:absolute;top:50%;right:3px;transform:translateY(-50%);width:3px;height:78px;border-radius:999px;background:color-mix(in srgb, var(--c-hairline) 72%, transparent);transition:background var(--transition-fast),height var(--transition-fast),box-shadow var(--transition-fast)}
.artifact-shell.open .artifact-edge-resizer{display:block}
.artifact-edge-resizer:hover::before{height:108px;background:var(--c-accent);box-shadow:0 0 0 4px color-mix(in srgb, var(--c-accent-muted) 48%, transparent)}
.artifact-shell.artifact-flash{animation:artifactFlash 0.4s ease}
@keyframes artifactFlash{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 2px var(--c-accent-muted) inset}}
.artifact-inner{display:flex;flex-direction:column;height:100%;min-height:0}
.artifact-toolbar{display:flex;justify-content:flex-end;align-items:center;padding:10px 12px;border-bottom:1px solid var(--c-hairline-soft);gap:8px;flex-shrink:0;background:color-mix(in srgb, var(--c-surface1) 80%, transparent)}
.artifact-layout-group{display:flex;gap:4px}
.artifact-layout-btn,.artifact-icon-btn{width:32px;height:32px;border-radius:var(--r-sm);font-size:14px;background:transparent;border:1px solid transparent;color:var(--c-ink-muted);cursor:pointer;display:grid;place-items:center;transition:background var(--transition-fast),border-color var(--transition-fast),color var(--transition-fast),transform var(--transition-fast)}
.artifact-layout-btn:hover,.artifact-icon-btn:hover{background:var(--c-accent-soft);border-color:var(--c-hairline-soft);color:var(--c-ink)}
.artifact-layout-btn.active{background:var(--c-accent-soft);border-color:var(--c-accent-muted);color:var(--c-ink)}
.artifact-icon-btn.sm{width:26px;height:26px;font-size:12px}
.artifact-toolbar-actions{display:flex;gap:4px;align-items:center}
.artifact-titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--c-hairline-soft);flex-shrink:0;font-size:13px;background:transparent}
.artifact-file-icon{font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--c-ink-muted)}
.artifact-title-text{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artifact-type-badge{font-size:10px;padding:2px 6px;border-radius:var(--r-sm);background:var(--c-accent-soft);color:var(--c-ink-muted)}

.skills-layout{display:flex;flex:1;overflow:hidden}
.skills-sidebar{width:280px;border-right:1px solid var(--c-hairline);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.skills-main{flex:1;overflow-y:auto;padding:0;min-width:0;display:flex;flex-direction:column}
.skill-cat-header{display:flex;align-items:center;gap:6px;padding:8px 12px;font-size:12px;font-weight:600;color:var(--c-ink-muted);text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;border-radius:var(--r-sm);transition:all var(--transition-fast)}
.skill-cat-header:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.skill-cat-header.active{color:var(--c-accent);background:var(--c-accent-muted)}
.skill-cat-header .cat-count{font-size:10px;padding:1px 6px;border-radius:var(--r-pill);background:var(--c-surface2);color:var(--c-ink-muted);font-weight:400}
.skill-cat-header .cat-arrow{transition:transform var(--transition-fast);font-size:10px}
.skill-cat-header .cat-arrow.collapsed{transform:rotate(-90deg)}
.skill-item{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 20px;font-size:13px;color:var(--c-ink-muted);cursor:pointer;border-radius:var(--r-sm);transition:all var(--transition-fast);position:relative}
.skill-item:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.skill-item.active{color:var(--c-accent);background:var(--c-accent-muted);font-weight:480}
.skill-item .sk-source-dot{width:6px;height:6px;border-radius:var(--r-full);flex-shrink:0}
.skill-item .sk-source-dot.builtin{background:#888}
.skill-item .sk-source-dot.hub{background:var(--c-magenta)}
.skill-item .sk-source-dot.local{background:var(--c-success)}
.skill-item .sk-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skill-item .sk-modified{color:var(--c-warning);font-size:12px;margin-left:2px}
.skill-item .sk-pinned{color:var(--c-accent);font-size:10px}
.skill-detail{flex:1;padding:24px 28px;overflow-y:auto}
.skill-detail-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.skill-detail-name{font-size:22px;font-weight:600;letter-spacing:-0.5px;flex:1}
.skill-detail-breadcrumb{font-size:12px;color:var(--c-ink-muted);margin-bottom:12px}
.skill-detail-breadcrumb span{cursor:pointer}.skill-detail-breadcrumb span:hover{color:var(--c-ink)}
.skill-detail-desc{font-size:15px;line-height:1.6;color:var(--c-ink-muted);margin-bottom:20px}
.skill-meta{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.skill-meta-item{font-size:12px;color:var(--c-ink-muted);display:flex;align-items:center;gap:4px}
.skill-meta-item svg{opacity:0.5}
.skill-detail-actions{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.skill-files{border-top:1px solid var(--c-hairline);padding-top:16px;margin-top:8px}
.skill-files h4{font-size:13px;font-weight:480;margin-bottom:8px;color:var(--c-ink-muted)}
.skill-file-item{display:flex;align-items:center;gap:6px;padding:6px 10px;font-size:13px;color:var(--c-ink-muted);border-radius:var(--r-sm);cursor:pointer;transition:all var(--transition-fast)}
.skill-file-item:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.skill-file-item.active{color:var(--c-accent);background:var(--c-accent-muted)}
.skill-content{border:1px solid var(--c-hairline);border-radius:var(--r-md);padding:16px;font-size:14px;line-height:1.6;background:var(--c-canvas);margin-top:12px;white-space:pre-wrap;font-family:var(--font-mono);font-size:13px;max-height:400px;overflow-y:auto}
.skill-search{padding:8px 12px;border-bottom:1px solid var(--c-hairline)}
.skill-search input{width:100%;padding:6px 10px;border-radius:var(--r-sm);border:1px solid var(--c-hairline);background:var(--c-canvas);color:var(--c-ink);font-size:13px}
.skill-search input:focus{border-color:var(--c-accent);outline:none}
.source-legend{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--c-hairline)}
.legend-item{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--c-ink-muted);padding:3px 10px;border:1px solid transparent;border-radius:var(--r-pill);cursor:pointer;transition:all var(--transition-fast)}
.legend-item:hover{color:var(--c-ink);background:var(--c-accent-soft)}
.legend-item.active{color:var(--c-ink);border-color:var(--c-hairline);background:var(--c-accent-muted)}
.legend-dot{width:8px;height:8px;border-radius:var(--r-full)}
.dot-builtin{background:#888}.dot-hub{background:var(--c-magenta)}.dot-local{background:var(--c-success)}.dot-modified{background:var(--c-warning)}
.skill-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--c-ink-muted)}
.skill-empty svg{opacity:0.3}
.skill-cat-items{overflow:hidden;transition:max-height var(--transition-normal)}
.memory-view{display:flex;flex-direction:column;height:100%}
.memory-content{flex:1;overflow:hidden;padding:20px}
.memory-sections{display:flex;gap:16px;height:100%}
.memory-section{flex:1;border:1px solid var(--c-hairline);border-radius:var(--r-md);overflow:hidden;display:flex;flex-direction:column;min-height:0}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--c-surface2);border-bottom:1px solid var(--c-hairline);flex-shrink:0}
.section-title-row{display:flex;align-items:center;gap:8px}
.section-icon{color:var(--c-ink-muted);display:flex}
.section-title{font-size:14px;font-weight:600}
.section-body{flex:1;overflow-y:auto;padding:16px}
.section-edit{flex:1;display:flex;flex-direction:column;padding:12px 16px;min-height:0}
.edit-textarea{flex:1;width:100%;min-height:0;padding:12px;border:1px solid var(--c-hairline);border-radius:var(--r-sm);background:var(--c-surface1);color:var(--c-ink);font-family:var(--font-mono);font-size:13px;line-height:1.6;resize:none}
.edit-textarea:focus{border-color:var(--c-accent)}
.edit-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.empty-text{color:var(--c-ink-muted);font-style:italic;font-size:13px}
.models-view{display:flex;flex-direction:column;height:100%}
.models-content{flex:1;overflow-y:auto;padding:20px}
.provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.provider-card{background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);padding:20px;transition:all var(--transition-fast)}
.provider-card:hover{border-color:var(--c-accent-muted)}
.provider-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.provider-name{font-size:16px;font-weight:600}
.provider-base{font-size:12px;color:var(--c-ink-muted);font-family:var(--font-mono);margin-bottom:8px;word-break:break-all}
.provider-models{display:flex;flex-wrap:wrap;gap:4px}
.model-tag{font-size:11px;padding:2px 8px;border-radius:var(--r-pill);background:var(--c-surface2);color:var(--c-ink-muted)}
.usage-view{display:flex;flex-direction:column;height:100%}
.usage-content{flex:1;overflow-y:auto;padding:20px;max-width:960px;margin:0 auto;width:100%}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);padding:20px}
.stat-card .stat-label{font-size:12px;color:var(--c-ink-muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.stat-card .stat-value{font-size:32px;font-weight:340;letter-spacing:-1px}
.stat-card .stat-change{font-size:12px;margin-top:4px}
.stat-change.up{color:var(--c-success)}.stat-change.down{color:var(--c-error)}
.stat-card.color-block .stat-value{font-size:36px;font-weight:600;letter-spacing:-1.5px}
.stat-card.color-block .stat-label{font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:0.8;margin-top:4px}
.chart-container{background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);padding:20px;margin-bottom:16px}
.chart-title{font-size:14px;font-weight:600;margin-bottom:16px}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:160px;padding-bottom:24px}
.bar{flex:1;background:var(--c-accent);border-radius:var(--r-xs) var(--r-xs) 0 0;transition:height 0.5s ease;min-width:8px;position:relative}
.bar:hover{opacity:0.8}
.bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--c-ink-muted);white-space:nowrap}
.breakdown-list{display:flex;flex-direction:column;gap:8px}
.breakdown-item{display:flex;align-items:center;gap:12px}
.breakdown-name{font-size:13px;width:120px;flex-shrink:0}
.breakdown-bar-wrap{flex:1;height:8px;background:var(--c-surface2);border-radius:var(--r-full);overflow:hidden}
.breakdown-bar-fill{height:100%;border-radius:var(--r-full);transition:width 0.5s ease}
.breakdown-value{font-size:12px;color:var(--c-ink-muted);width:60px;text-align:right}
.settings-view{display:flex;flex-direction:column;height:100%}
.settings-content{flex:1;overflow-y:auto;padding:20px}
.setting-group{margin-bottom:24px}
.setting-group-title{font-size:14px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--c-hairline)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--c-hairline-soft)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px;font-weight:330}
.setting-desc{font-size:12px;color:var(--c-ink-muted);margin-top:2px}
.setting-control{flex-shrink:0}
.toggle{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;inset:0;background:var(--c-hairline);border-radius:var(--r-full);transition:background var(--transition-fast)}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:#fff;border-radius:var(--r-full);transition:transform var(--transition-fast)}
.toggle input:checked+.toggle-slider{background:#3b82f6}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px)}
.channels-view{display:flex;flex-direction:column;height:100%}
.channels-content{flex:1;overflow-y:auto;padding:20px}
.platform-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.platform-card{background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);padding:20px;transition:all var(--transition-fast)}
.platform-card:hover{border-color:var(--c-accent-muted)}
.platform-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.platform-icon{width:40px;height:40px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:20px}
.platform-name{font-size:16px;font-weight:600}
.platform-status{font-size:11px;padding:2px 8px;border-radius:var(--r-pill)}
.platform-status.connected{background:rgba(30,166,74,0.12);color:var(--c-success)}
.platform-status.disconnected{background:rgba(229,57,53,0.12);color:var(--c-error)}
.profiles-view{display:flex;flex-direction:column;height:100%}
.profiles-content{flex:1;overflow-y:auto;padding:20px}
.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.profile-card{background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);padding:20px;transition:all var(--transition-fast);cursor:pointer}
.profile-card:hover{border-color:var(--c-accent-muted)}
.profile-avatar{width:48px;height:48px;border-radius:var(--r-full);margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600}
.profile-name{font-size:16px;font-weight:600;margin-bottom:4px}
.profile-model{font-size:12px;color:var(--c-ink-muted)}
.gateways-view{display:flex;flex-direction:column;height:100%}
.gateways-content{flex:1;overflow-y:auto;padding:20px}
.gateway-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.gateway-card{background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);padding:20px}
.logs-view{display:flex;flex-direction:column;height:100%}
.log-container{flex:1;overflow-y:auto;padding:0;font-family:var(--font-mono);font-size:12px;line-height:1.6;background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-lg);margin:0 24px 24px}
.log-line{padding:6px 16px;border-bottom:1px solid var(--c-hairline-soft);display:flex;gap:8px;align-items:baseline}
.log-line:hover{background:var(--c-accent-soft)}
.log-line.log-error{background:rgba(229,57,53,0.05)}
.log-line.log-warn{background:rgba(249,168,37,0.05)}
.log-ts{color:var(--c-ink-muted);margin-right:4px;white-space:nowrap;font-size:11px}
.log-level{font-weight:600;margin-right:8px;font-size:11px;text-transform:uppercase}
.log-line.log-info .log-level{color:var(--c-accent)}
.log-line.log-warn .log-level{color:var(--c-warning)}
.log-line.log-error .log-level{color:var(--c-error)}
.log-msg{color:var(--c-ink);flex:1}
.files-view{display:flex;flex-direction:column;height:100%}
.files-content{flex:1;overflow:hidden}
.files-layout{display:flex;height:100%}
.files-tree{width:260px;border-right:1px solid var(--c-hairline);overflow-y:auto;padding:8px}
.files-main{flex:1;overflow-y:auto;padding:20px}
.file-item{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;color:var(--c-ink-muted);transition:all var(--transition-fast)}
.file-item:hover{background:var(--c-accent-soft);color:var(--c-ink)}
.file-item.active{background:var(--c-accent-muted);color:var(--c-accent)}
.file-item.folder{color:var(--c-ink)}
.terminal-view{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}
.terminal-container{flex:1;overflow:hidden;display:flex;flex-direction:column;padding:16px;min-height:0;max-height:0;transition:max-height 0.3s ease;background:var(--c-terminal-bg);font-family:var(--font-mono);font-size:13px;line-height:1.6;color:var(--c-terminal-ink)}
.terminal-container.expanded{max-height:100vh;overflow-y:auto}
.term-line{white-space:pre-wrap;word-break:break-all;padding:1px 0}
.term-prompt{color:var(--c-success);margin-right:8px}
.terminal-input-line{display:flex;align-items:center;gap:0;margin-top:8px}
.terminal-input{background:transparent;border:none;color:var(--c-terminal-ink);font-family:var(--font-mono);font-size:13px;flex:1;outline:none;padding:0}
.search-view{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto}
.search-content{flex:1;overflow-y:auto;padding:20px;max-width:800px;margin:0 auto;width:100%;max-height:0;transition:max-height 0.3s ease}
.search-content.expanded{max-height:100vh}
.typing-indicator{display:flex;gap:4px;padding:8px 0}
.typing-dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--c-ink-muted);animation:pulse 1.4s infinite}
.typing-dot:nth-child(2){animation-delay:0.2s}
.typing-dot:nth-child(3){animation-delay:0.4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.animate-in{animation:fadeIn 0.3s ease}
.animate-slide{animation:slideIn 0.3s ease}
.settings-section{margin-bottom:32px}
.settings-section-title{font-size:14px;font-weight:600;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--c-hairline)}
.settings-item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--c-hairline-soft)}
.settings-label{font-size:14px;font-weight:330}
.settings-desc{font-size:12px;color:var(--c-ink-muted);margin-top:2px}
.settings-content{flex:1;overflow-y:auto;padding:0 24px 24px}
.usage-models{padding:0 24px 24px}
.memory-stats,.usage-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:0 24px 24px}
.search-input{background:var(--c-surface1);border:1px solid var(--c-hairline);border-radius:var(--r-pill);padding:8px 14px 8px 36px;font-size:13px;width:200px;transition:all var(--transition-fast)}
.search-input:focus{border-color:var(--c-accent);width:260px}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap svg{position:absolute;left:12px;color:var(--c-ink-muted);pointer-events:none}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--c-ink-muted);font-size:14px}
.empty-state svg{opacity:0.2}
.divider{height:1px;background:var(--c-hairline);margin:16px 0}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:480}
.tag-accent{background:var(--c-accent-soft);color:var(--c-accent)}
.tag-success{background:rgba(30,166,74,0.12);color:var(--c-success)}
.tag-warning{background:rgba(249,168,37,0.12);color:var(--c-warning)}
.tag-error{background:rgba(229,57,53,0.12);color:var(--c-error)}
.tag-muted{background:var(--c-hairline);color:var(--c-ink-muted)}
.chart{display:flex;align-items:flex-end;gap:8px;height:200px;padding-top:20px}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;background:var(--c-accent);border-radius:var(--r-sm) var(--r-sm) 0 0;position:relative;min-height:4px;transition:height 0.5s ease}
.chart-bar:hover{opacity:0.8}
.chart-val{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--c-ink-muted);white-space:nowrap}
.chart-label{font-size:11px;color:var(--c-ink-muted)}
.channel-card{transition:all var(--transition-fast)}
.channel-card:hover{border-color:var(--c-accent-muted)}
.toast{position:fixed;top:24px;right:24px;padding:12px 20px;border-radius:var(--r-lg);font-size:13px;font-weight:480;z-index:2000;animation:fadeIn 0.3s ease;box-shadow:0 4px 16px rgba(0,0,0,0.06)}
.toast-success{background:var(--c-success);color:#fff}
.toast-error{background:var(--c-error);color:#fff}
.toast-info{background:var(--c-accent);color:var(--c-on-primary)}
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;z-index:100;transform:translateX(-100%);transition:transform var(--transition-normal)}
  .sidebar.mobile-open{transform:translateX(0)}
  .mobile-backdrop{position:fixed;inset:0;background:var(--c-overlay);z-index:99;opacity:0;pointer-events:none;transition:opacity var(--transition-fast)}
  .mobile-backdrop.show{opacity:1;pointer-events:auto}
  .hamburger{display:flex !important}
  .session-sidebar{position:absolute;left:0;top:0;height:100%;z-index:10;background:var(--c-canvas);box-shadow:2px 0 8px rgba(0,0,0,0.15);width:280px}
  .session-sidebar.collapsed{transform:translateX(-100%)}
  .memory-sections{flex-direction:column}
  .skills-layout{flex-direction:column}
  .skills-sidebar{width:100%;height:200px;border-right:none;border-bottom:1px solid var(--c-hairline)}
}
.hamburger{display:none;width:40px;height:40px;align-items:center;justify-content:center;border-radius:var(--r-full);background:var(--c-surface1);color:var(--c-ink);cursor:pointer;position:fixed;top:12px;left:12px;z-index:101}
.hidden{display:none!important}
.hidden{max-height:0!important;overflow:hidden}
.fig-display-xl{font-size:86px;font-weight:340;line-height:1;letter-spacing:-1.72px}
.fig-display-lg{font-size:64px;font-weight:340;line-height:1.1;letter-spacing:-0.96px}
.fig-headline{font-size:26px;font-weight:600;line-height:1.35;letter-spacing:-0.26px}
.fig-subhead{font-size:26px;font-weight:340;line-height:1.35;letter-spacing:-0.26px}
.fig-body-lg{font-size:20px;font-weight:330;line-height:1.4;letter-spacing:-0.14px}
.fig-body{font-size:18px;font-weight:320;line-height:1.45;letter-spacing:-0.26px}
.fig-body-sm{font-size:16px;font-weight:330;line-height:1.45;letter-spacing:-0.14px}
.fig-eyebrow{font-size:18px;font-weight:400;line-height:1.3;letter-spacing:0.54px;font-family:var(--font-mono);text-transform:uppercase}
