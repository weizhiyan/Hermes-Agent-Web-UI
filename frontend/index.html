<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>Hermes Agent</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%23165DFF'/><text x='50' y='68' font-size='55' font-weight='800' fill='white' text-anchor='middle' font-family='system-ui'>H</text></svg>" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body data-theme="dark">
  <!-- ========== Rail ========== -->
  <aside class="rail">
    <div class="rail-logo">H</div>
    <nav class="rail-nav">
      <button class="rail-btn active" data-view="chat" title="对话">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="rail-btn" data-view="memory" title="记忆">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </button>
      <button class="rail-btn" data-view="tools" title="技能">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </button>
      <button class="rail-btn" data-view="tasks" title="任务">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg>
      </button>
      <button class="rail-btn" data-view="models" title="模型配置">
        <svg viewBox="0 0 24 24" width="18" height="18"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
      </button>
      <button class="rail-btn" data-view="settings" title="设置">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </nav>
    <div class="rail-foot">
      <span id="connDot" class="dot off"></span>
      <button class="theme-toggle" id="themeToggleBtn" title="切换深浅模式">
        <svg id="themeIconSun" viewBox="0 0 24 24" width="16" height="16" style="display:block"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="themeIconMoon" viewBox="0 0 24 24" width="16" height="16" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </div>
  </aside>

  <!-- ========== Content Area (sidebar + main) ========== -->
  <div class="content-area">
    <!-- ========== Sidebar (only on chat page) ========== -->
    <aside class="sidebar" id="sidebar">
      <header class="sidebar-head">
        <h1 class="brand">Hermes</h1>
        <button class="icon-btn" id="collapseBtn">&#x25C0;</button>
      </header>
      <button class="btn btn-primary btn-block" id="newChatBtn">+ 新建对话</button>
      <input class="input" id="chatSearch" placeholder="搜索对话..." style="width:100%" />
      <div class="sidebar-title">对话历史</div>
      <div id="chatList" class="chat-list"></div>
    </aside>

    <!-- ========== Main ========== -->
    <main class="main">
      <div class="history-bar" id="historyBar">
        <svg viewBox="0 0 24 24" width="14" height="14"><polyline points="15 18 9 12 15 6"/></svg>
        <span>对话历史</span> <span class="count" id="historyCount">0</span>
      </div>
      <div class="mid-wrap">
        <!-- ===== Chat view ===== -->
        <section class="view" data-view="chat">
          <div class="chat-wrap">
            <header class="view-head">
              <div class="chat-title" id="chatTitle">新建对话</div>
              <div class="view-actions">
                <div class="dropdown-wrap">
                  <button class="btn btn-ghost" id="modelSwitchBtn" style="font-size:12px">deepseek &#x25BE;</button>
                  <div class="dropdown-menu" id="modelSwitchMenu"></div>
                </div>
                <button class="icon-btn" id="toggleSourceBtn" title="查看源码">
                  <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                </button>
              </div>
            </header>
            <div class="messages" id="messages">
              <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-logo">H</div>
                <div class="welcome-title">Hermes Agent</div>
                <div class="welcome-sub">智能 AI 助手 — 随时为你效劳</div>
                <div class="welcome-hints">
                  <button class="welcome-hint" data-prompt="帮我写一段 Python 快速排序">💻 写一段代码</button>
                  <button class="welcome-hint" data-prompt="解释一下量子计算的基本原理">🧠 解释概念</button>
                  <button class="welcome-hint" data-prompt="帮我优化这段代码的性能">🔧 优化代码</button>
                  <button class="welcome-hint" data-prompt="翻译以下内容为英文">🌍 翻译内容</button>
                </div>
              </div>
            </div>
            <div class="composer">
              <div class="input-bar">
                <div class="input-bar-left">
                  <div class="dropdown-wrap">
                    <button class="dropdown-btn" id="cmdBtn">/ 命令</button>
                    <div class="dropdown-menu" id="cmdMenu"></div>
                  </div>
                  <div class="dropdown-wrap">
                    <button class="dropdown-btn" id="skillToggleBtn">&#x25C7; 技能</button>
                    <div class="dropdown-menu" id="skillToggleMenu" style="min-width:220px"></div>
                  </div>
                  <button class="link" id="uploadFileBtn">&#x1F4CE; 附件</button>
                  <input type="file" id="fileInput" style="display:none" multiple />
                </div>
                <textarea id="input" rows="1" placeholder="向 Hermes 发送消息..."></textarea>
                <div class="input-foot">
                  <div style="display:flex;gap:6px"><button class="btn btn-primary" id="sendBtn">发送</button><button class="btn btn-danger" id="stopBtn" style="display:none">停止</button></div>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ===== Memory view ===== -->
        <section class="view hidden" data-view="memory">
          <div class="page-wrap">
            <header class="view-head">
              <div class="chat-title">记忆</div>
              <div class="view-actions">
                <input id="memorySearch" class="input" placeholder="搜索记忆..." style="width:180px" />
              </div>
            </header>
            <div class="mid-content" id="memoryContent">
              <div class="empty-state">
                <div class="empty-icon">◇</div>
                <div class="empty-title">记忆空间</div>
                <div class="empty-desc">与 Hermes 的对话会自动保存在这里，方便随时回顾</div>
              </div>
            </div>
          </div>
        </section>

        <!-- ===== Tools/Skills view ===== -->
        <section class="view hidden" data-view="tools">
          <div class="page-wrap">
            <header class="view-head">
              <div class="chat-title">工具与技能</div>
              <div class="view-actions">
                <input id="skillSearch" class="input" placeholder="搜索技能..." style="width:180px" />
                <button class="btn btn-primary" id="addSkillBtn">+ 新增</button>
              </div>
            </header>
            <div class="tabs" id="skillTabs">
              <div class="tab active" data-tab="builtin">内置技能</div>
              <div class="tab" data-tab="custom">我添加的</div>
              <div class="tab" data-tab="user">用户制作的</div>
            </div>
            <div class="skill-grid" id="skillGrid"></div>
          </div>
        </section>

        <!-- ===== Tasks view ===== -->
        <section class="view hidden" data-view="tasks">
          <div class="page-wrap">
            <header class="view-head">
              <div class="chat-title">任务</div>
              <div class="view-actions">
                <button class="btn btn-primary" id="newTaskBtn">+ 新建任务</button>
              </div>
            </header>
            <div class="mid-content" id="tasksContent">
              <div class="empty-state">
                <div class="empty-icon">□</div>
                <div class="empty-title">任务看板</div>
                <div class="empty-desc">创建和管理你的 AI 任务</div>
              </div>
            </div>
          </div>
        </section>

        <!-- ===== Models view ===== -->
        <section class="view hidden" data-view="models">
          <div class="page-wrap">
            <header class="view-head"><div class="chat-title">模型配置</div></header>
            <div class="form-scroll" id="modelsForm"></div>
            <div class="form-footer"><button class="btn btn-primary" id="saveModelsBtn">保存</button></div>
          </div>
        </section>

        <!-- ===== Settings view ===== -->
        <section class="view hidden" data-view="settings">
          <div class="page-wrap">
            <header class="view-head"><div class="chat-title">设置</div></header>
            <div class="form-scroll" id="settingsForm"></div>
            <div class="form-footer"><button class="btn btn-primary" id="saveSettingsBtn">保存</button></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- ========== Right panel (grid column) ========== -->
  <aside class="rpanel" id="rpanel">
    <header class="rpanel-head">
      <span id="rpanelTitle">详情</span>
      <button class="icon-btn" id="closeRpanel">&#x2715;</button>
    </header>
    <div class="rpanel-body" id="rpanelBody"></div>
  </aside>

  <!-- ========== Skill edit modal ========== -->
  <div class="modal-overlay" id="skillModal">
    <div class="modal">
      <header class="modal-head"><span id="skillModalTitle">编辑技能</span><button class="icon-btn" id="closeSkillModal">&#x2715;</button></header>
      <div class="modal-body" style="display:grid;gap:12px;grid-template-columns:1fr 1fr">
        <div class="form-item"><label>图标</label><input class="input" id="skillIcon" maxlength="2" /></div>
        <div class="form-item"><label>名称</label><input class="input" id="skillName" /></div>
        <div class="form-item" style="grid-column:1/-1"><label>描述</label><input class="input" id="skillDesc" /></div>
        <div class="form-item" style="grid-column:1/-1"><label>标签</label><input class="input" id="skillTags" placeholder="用逗号分隔，如：代码, 重构" /></div>
        <div class="form-item" style="grid-column:1/-1"><label>提示词</label><textarea class="input" id="skillPrompt" rows="4"></textarea></div>
      </div>
      <footer class="modal-foot"><button class="btn btn-ghost" id="cancelSkillModal">取消</button><button class="btn btn-primary" id="saveSkillModal">保存</button></footer>
    </div>
  </div>

  <!-- ========== Commands modal ========== -->
  <div class="modal-overlay" id="cmdModal">
    <div class="modal" style="max-width:400px">
      <header class="modal-head"><span>命令列表</span><button class="icon-btn" id="closeCmdModal">&#x2715;</button></header>
      <div class="modal-body"><div class="cmd-list" id="cmdList"></div></div>
    </div>
  </div>

  <!-- ========== Mobile bottom nav ========== -->
  <nav class="mobile-nav">
    <button class="mobile-nav-btn active" data-view="chat">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
    <button class="mobile-nav-btn" data-view="memory">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </button>
    <button class="mobile-nav-btn" data-view="tools">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    </button>
    <button class="mobile-nav-btn" data-view="tasks">
      <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/></svg>
    </button>
    <button class="mobile-nav-btn" data-view="settings">
      <svg viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </nav>

  <div id="toast" class="toast"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
