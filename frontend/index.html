<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hermes Agent</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
</head>
<body data-theme="dark">
  <!-- ========== Rail ========== -->
  <aside class="rail">
    <div class="rail-logo">H</div>
    <nav class="rail-nav">
      <button class="rail-btn active" data-view="chat" title="对话">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
      <button class="rail-btn" data-view="tools" title="工具与技能">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      </button>
      <button class="rail-btn" data-view="models" title="模型配置">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="8" height="8" rx="2"/><rect x="14" y="2" width="8" height="8" rx="2"/><rect x="2" y="14" width="8" height="8" rx="2"/><rect x="14" y="14" width="8" height="8" rx="2"/></svg>
      </button>
      <button class="rail-btn" data-view="settings" title="设置">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </nav>
    <div class="rail-foot"><span id="connDot" class="dot off"></span></div>
  </aside>

  <!-- ========== Sidebar ========== -->
  <aside class="sidebar" id="sidebar">
    <header class="sidebar-head">
      <h1 class="brand">Hermes</h1>
      <button class="icon-btn" id="collapseBtn">&#x25C0;</button>
    </header>
    <button class="btn btn-primary btn-block" id="newChatBtn">+ 新建对话</button>
    <input class="input" id="chatSearch" placeholder="搜索对话..." style="width:100%" />
    <div class="sidebar-title">对话历史</div>
    <div id="chatList" class="chat-list"></div>
  </aside>

  <!-- ========== History bar ========== -->
  <div class="history-bar" id="historyBar" style="display:none">
    <svg viewBox="0 0 24 24" width="14" height="14"><polyline points="15 18 9 12 15 6"/></svg>
    <span>对话历史</span> <span class="count" id="historyCount">0</span>
  </div>

  <!-- ========== Main ========== -->
  <main class="main">
    <section class="view" data-view="chat">
      <header class="view-head">
        <div class="chat-title" id="chatTitle">新建对话</div>
        <div class="view-actions">
          <div class="dropdown-wrap">
            <button class="dropdown-btn" id="cmdBtn">/ 命令</button>
            <div class="dropdown-menu" id="cmdMenu"></div>
          </div>
          <div class="dropdown-wrap">
            <button class="dropdown-btn" id="skillToggleBtn">&#x25C7; 技能</button>
            <div class="dropdown-menu" id="skillToggleMenu" style="min-width:220px"></div>
          </div>
          <button class="btn btn-ghost" id="modelSwitchBtn" style="font-size:12px">deepseek &#x25BE;</button>
          <button class="btn btn-ghost" id="exportBtn" style="font-size:12px">导出 &#x25BE;</button>
          <div class="dropdown-menu" id="exportMenu" style="min-width:100px;display:none;position:absolute;right:0;top:100%;z-index:100;">
            <button class="dropdown-item" data-fmt="md">Markdown</button>
            <button class="dropdown-item" data-fmt="json">JSON</button>
          </div>
          <button class="icon-btn" id="toggleSourceBtn">
            <svg viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
          </button>
        </div>
      </header>
      <div class="messages" id="messages">
        <div class="msg asst" style="max-width:90%;align-self:center;text-align:center;opacity:.6">
          <div class="bubble" style="background:transparent;border:none;font-size:13px">
            Hermes Agent &#x2014; 智能 AI 助手<br><span style="color:var(--text-3);font-size:12px">发送消息开始对话</span>
          </div>
        </div>
      </div>
      <div class="composer">
        <div class="input-bar">
          <div id="attachments" class="attachments"></div>
          <textarea id="input" rows="1" placeholder="向 Hermes 发送消息..."></textarea>
          <div class="input-foot">
            <div class="input-tools"><button class="link" id="uploadFileBtn">&#x1F4CE; 附件</button><input type="file" id="fileInput" style="display:none" multiple /></div>
            <div style="display:flex;gap:6px"><button class="btn btn-primary" id="sendBtn">发送</button><button class="btn btn-danger" id="stopBtn" style="display:none">停止</button></div>
          </div>
        </div>
      </div>
    </section>

    <section class="view hidden" data-view="tools">
      <header class="view-head">
        <div class="chat-title">工具与技能</div>
        <div class="view-actions">
          <input id="skillSearch" class="input" placeholder="搜索技能..." style="width:180px" />
          <button class="btn btn-primary" id="addSkillBtn">+ 新增</button>
        </div>
      </header>
      <div class="tabs" id="skillTabs">
        <div class="tab active" data-tab="builtin">内置技能</div>
        <div class="tab" data-tab="custom">我添加的</div>
        <div class="tab" data-tab="user">用户制作的</div>
      </div>
      <div class="skill-grid" id="skillGrid"></div>
    </section>

    <section class="view hidden" data-view="models">
      <header class="view-head"><div class="chat-title">模型配置</div></header>
      <div class="form-grid" id="modelsForm"></div>
      <div style="padding:0 20px 16px"><button class="btn btn-primary" id="saveModelsBtn">保存</button></div>
    </section>

    <section class="view hidden" data-view="settings">
      <header class="view-head"><div class="chat-title">设置</div></header>
      <div class="form-grid" id="settingsForm"></div>
      <div style="padding:0 20px 16px"><button class="btn btn-primary" id="saveSettingsBtn">保存</button></div>
    </section>
  </main>

  <!-- ========== Right panel ========== -->
  <aside class="rpanel hidden" id="rpanel">
    <header class="rpanel-head">
      <span id="rpanelTitle">详情</span>
      <button class="icon-btn" id="closeRpanel">&#x2715;</button>
    </header>
    <div class="rpanel-body" id="rpanelBody"></div>
  </aside>

  <!-- ========== Skill edit modal ========== -->
  <div class="modal-overlay" id="skillModal">
    <div class="modal">
      <header class="modal-head"><span id="skillModalTitle">编辑技能</span><button class="icon-btn" id="closeSkillModal">&#x2715;</button></header>
      <div class="modal-body" style="display:grid;gap:12px;grid-template-columns:1fr 1fr">
        <div class="form-item"><label>图标</label><input class="input" id="skillIcon" maxlength="2" /></div>
        <div class="form-item"><label>名称</label><input class="input" id="skillName" /></div>
        <div class="form-item" style="grid-column:1/-1"><label>描述</label><input class="input" id="skillDesc" /></div>
        <div class="form-item" style="grid-column:1/-1"><label>标签</label><input class="input" id="skillTags" /></div>
        <div class="form-item" style="grid-column:1/-1"><label>提示词</label><textarea class="input" id="skillPrompt" rows="4"></textarea></div>
      </div>
      <footer class="modal-foot"><button class="btn btn-ghost" id="cancelSkillModal">取消</button><button class="btn btn-primary" id="saveSkillModal">保存</button></footer>
    </div>
  </div>

  <!-- ========== Commands modal ========== -->
  <div class="modal-overlay" id="cmdModal">
    <div class="modal" style="max-width:400px">
      <header class="modal-head"><span>命令列表</span><button class="icon-btn" id="closeCmdModal">&#x2715;</button></header>
      <div class="modal-body"><div class="cmd-list" id="cmdList"></div></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Single merged script - no ES modules -->
  <script src="js/hermes-app.js"></script>
</body>
</html>
